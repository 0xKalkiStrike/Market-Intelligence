[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# Explicit, stable rule selection. Without this file, ruff (when no config
# is found anywhere) enables its full rule catalog instead of the documented
# default (E4, E7, E9, F), which is what was unexpectedly failing CI.
select = ["E4", "E7", "E9", "F"]

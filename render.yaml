# Render Blueprint Specification for MMJ-DOCS Market Intelligence Platform
services:
  # 1. Backend Web Service (FastAPI)
  - type: web
    name: market-intelligence-backend
    env: python
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:///./market_intelligence.db
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: CREDENTIAL_ENCRYPTION_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: '["*"]'
    healthCheckPath: /api/health

  # 2. Frontend Web Service (Next.js)
  - type: web
    name: market-intelligence-frontend
    env: node
    region: oregon
    plan: starter
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://market-intelligence-backend-2afj.onrender.com
      - key: BACKEND_URL
        value: https://market-intelligence-backend-2afj.onrender.com
    healthCheckPath: /
